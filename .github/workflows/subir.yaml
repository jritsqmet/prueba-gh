name: Despligue en DockerHub

# SE EJECUTA AL HACER UN PUSH (master)
on: 
  push:
    branches: [master]

jobs:
  desplegar:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest

    # PASOS DEL JOB
    steps:
      # PASO 1: DESCARGAR EL CÓDIGO DEL REPO
      - name: Descargar código fuente
        uses: actions/checkout@v4

      # PASO 2: AUTENTICARSE EN DOCKER-HUB
      - name: Iniciar sesión en DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
      # PASO 3: COMPILAR Y SUBIR LA IMAGEN
      - name: Compilar y subir la a imagen DockerHub
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}






